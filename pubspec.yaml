name: a_chatz
description: A premium WhatsApp-like Flutter messaging platform starter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  screen_protector: ^1.5.2
  pdfx: ^2.5.0
  flutter_tts: ^3.8.5

  # =========================
  # SUPABASE BACKEND
  # =========================
  supabase_flutter: ^2.8.3
  path: ^1.9.0

  # =========================
  # STATE / ARCHITECTURE
  # =========================
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  url_launcher: ^6.3.2
  http: ^1.2.1
  equatable: ^2.0.7
  uuid: ^4.5.3
  disk_space_2: ^1.0.3

  # =========================
  # UI / DESIGN
  # =========================
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # =========================
  # MEDIA / CHAT
  # =========================
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  video_player: ^2.9.1
  open_filex: ^4.5.0

  # =========================
  # VOICE NOTES
  # =========================
  record: ^6.0.0
  just_audio: ^0.9.42
  path_provider: ^2.1.5

  # =========================
  # NOTIFICATIONS
  # =========================
  flutter_local_notifications: ^17.2.4

  # =========================
  # CALLS / WEBRTC
  # =========================
  flutter_webrtc: ^1.5.2
  wakelock_plus: ^1.2.8

  # =========================
  # LOCAL / DEVICE
  # =========================
  shared_preferences: ^2.5.5
  permission_handler: ^11.4.0
  flutter_ringtone_player: ^4.0.0+4
  flutter_callkit_incoming: ^3.0.0
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  easy_localization: ^3.0.8
  audioplayers: ^6.6.0
  gal: ^2.3.2
  geolocator: ^13.0.2
  package_info_plus: ^9.0.1
  google_generative_ai: ^0.4.5
  speech_to_text: ^7.4.0
  flutter_markdown: ^0.7.3
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  zxing2: ^0.2.4
  image: ^4.8.0
  any_link_preview: ^3.0.1
  sensors_plus: ^7.0.0
  camera: ^0.12.0+1
  flutter_native_splash: ^2.4.6
  pro_image_editor: ^11.0.0
  flutter_background: ^1.3.1
  simple_pip_mode: ^1.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # =========================
  # PAYMENT GATEWAYS
  # =========================
  flutter_stripe: ^11.3.0
  razorpay_flutter: ^1.3.7
  flutter_paystack: ^1.0.7
  paypal_sdk: ^0.2.0
  flutterwave_standard: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/splash_logo.png"
    background_color: "#0f0f11"
    theme_color: "#0f0f11"
  image_path: "assets/splash_logo.png" # You can replace this with your 1024x1024 app_icon.png

flutter_native_splash:
  color: "#000000"
  image: assets/splash_logo.png
  android_12:
    color: "#000000"
    image: assets/splash_logo.png
  android: true
  ios: true
  web: false
dependency_overrides:
  intl: ^0.20.2
  http: ^1.2.1
  flutter_paystack:
    path: packages/flutter_paystack

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/logo.png
    - assets/logo_transparent.png
    - assets/splash_logo.png
    - assets/chime.wav
    - assets/premium_chime.wav
    - assets/ringtone.mp3
    - assets/incoming_ringtone.mp3
    - assets/ringback_tone.wav